name: affine
services:
  affine:
    image: ${AFFINE_IMAGE:-ghcr.io/toeverything/affine:stable}
    container_name: affine_server
    ports:
      - '3010:3010'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      affine_migration:
        condition: service_completed_successfully
    volumes:
      - ./data/storage:/root/.affine/storage
      - ./config:/root/.affine/config
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://affine@postgres:5432/affine
      - DEPLOYMENT_TYPE=selfhosted
      # Optional self-hosted limits. Values apply per user/workspace after restart.
      # AFFINE_STORAGE_QUOTA_GB=0 keeps the built-in 100 GB limit.
      - AFFINE_STORAGE_QUOTA_GB=${AFFINE_STORAGE_QUOTA_GB:-100}
      - AFFINE_BLOB_LIMIT_MB=${AFFINE_BLOB_LIMIT_MB:-500}
    restart: unless-stopped

  affine_migration:
    image: ${AFFINE_IMAGE:-ghcr.io/toeverything/affine:stable}
    container_name: affine_migration_job
    volumes:
      - ./data/storage:/root/.affine/storage
      - ./config:/root/.affine/config
    command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://affine@postgres:5432/affine
      - DEPLOYMENT_TYPE=selfhosted
      - AFFINE_STORAGE_QUOTA_GB=${AFFINE_STORAGE_QUOTA_GB:-100}
      - AFFINE_BLOB_LIMIT_MB=${AFFINE_BLOB_LIMIT_MB:-500}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis
    container_name: affine_redis
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: affine_postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: affine
      POSTGRES_DB: affine
      POSTGRES_INITDB_ARGS: '--data-checksums'
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'affine', '-d', 'affine']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
