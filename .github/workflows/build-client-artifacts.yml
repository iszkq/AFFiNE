name: Build Client Artifacts

on:
  workflow_dispatch:
    inputs:
      app-version:
        description: 'Version written into the client packages'
        required: true
        default: '0.27.5'
        type: string

permissions:
  contents: read

env:
  BUILD_TYPE: canary
  PUBLIC_PATH: '/'
  RELEASE_VERSION: ${{ inputs.app-version }}
  DEBUG: 'affine:*,napi:*'

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          extra-flags: workspaces focus @affine/electron @affine-tools/cli @affine/monorepo @affine/nbstore @toeverything/infra
          hard-link-nm: false
          nmHoistingLimits: workspaces
          enableScripts: true

      - name: Build AFFiNE native
        uses: ./.github/actions/build-rust
        with:
          target: x86_64-pc-windows-msvc
          package: '@affine/native'

      - name: Build desktop web assets
        run: yarn affine @affine/electron generate-assets

      - name: Build desktop layers
        run: yarn affine @affine/electron build

      - name: Package Windows app
        run: yarn affine @affine/electron package --platform=win32 --arch=x64
        env:
          HOIST_NODE_MODULES: 1
          SKIP_WEB_BUILD: 1
          NODE_OPTIONS: --max-old-space-size=14384

      - name: Make Squirrel installer
        run: yarn affine @affine/electron make-squirrel --platform=win32 --arch=x64

      - name: Make NSIS installer
        run: yarn affine @affine/electron make-nsis --platform=win32 --arch=x64

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: affine-windows-x64-${{ inputs.app-version }}
          path: packages/frontend/apps/electron/out/**/make/**
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          extra-flags: workspaces focus @affine/monorepo @affine-tools/cli @affine/android
          hard-link-nm: false
          enableScripts: false

      - name: Setup Rust
        uses: ./.github/actions/build-rust
        with:
          target: aarch64-linux-android
          package: affine_mobile_native
          no-build: 'true'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build Android web assets
        run: yarn affine @affine/android build

      - name: Capacitor sync
        run: yarn workspace @affine/android cap sync

      - name: Provide non-publishing Firebase config
        shell: bash
        run: |
          cat > packages/frontend/apps/android/App/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "affine-build",
              "storage_bucket": "affine-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {"package_name": "app.affine.pro"}
                },
                "api_key": [{"current_key": "not-for-production"}]
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build debug APK
        working-directory: packages/frontend/apps/android/App
        run: ./gradlew assembleCanaryDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: affine-android-canary-debug-${{ inputs.app-version }}
          path: packages/frontend/apps/android/App/app/build/outputs/apk/**/app-*-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: iOS unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          extra-flags: workspaces focus @affine/monorepo @affine-tools/cli @affine/ios
          hard-link-nm: false
          enableScripts: false

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.2

      - name: Setup Ruby and CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: packages/frontend/apps/ios/App

      - name: Build iOS web assets
        run: yarn affine @affine/ios build

      - name: Capacitor sync
        run: yarn workspace @affine/ios sync

      - name: Setup Rust target
        uses: ./.github/actions/build-rust
        with:
          target: aarch64-apple-ios
          package: affine_mobile_native
          no-build: 'true'

      - name: Build unsigned device archive
        working-directory: packages/frontend/apps/ios/App
        run: |
          bundle exec pod install
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/AFFiNE.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/AFFiNE.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/AFFiNE.app"
          cd "$RUNNER_TEMP"
          zip -qry "AFFiNE-${{ inputs.app-version }}-unsigned.ipa" Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: affine-ios-unsigned-${{ inputs.app-version }}
          path: ${{ runner.temp }}/AFFiNE-${{ inputs.app-version }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
