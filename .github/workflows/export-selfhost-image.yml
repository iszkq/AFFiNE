name: Export Self-hosted Offline Bundle

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing tag in ghcr.io/iszkq/affine
        type: string
        required: true
        default: zh-byok

permissions:
  contents: read
  packages: read

jobs:
  export:
    name: Export Linux amd64 bundle
    runs-on: ubuntu-latest
    env:
      AFFINE_IMAGE: ghcr.io/iszkq/affine:${{ inputs.image_tag }}
      REDIS_IMAGE: redis:latest
      POSTGRES_IMAGE: pgvector/pgvector:pg16
    steps:
      - name: Validate image tag
        shell: bash
        run: |
          [[ "${{ inputs.image_tag }}" =~ ^[a-zA-Z0-9._-]+$ ]] || {
            echo 'Invalid image tag'
            exit 1
          }

      - name: Pull Linux amd64 images
        shell: bash
        run: |
          docker pull --platform linux/amd64 "$AFFINE_IMAGE"
          docker pull --platform linux/amd64 "$REDIS_IMAGE"
          docker pull --platform linux/amd64 "$POSTGRES_IMAGE"

      - name: Save all images into one archive
        shell: bash
        run: |
          set -Eeuo pipefail
          docker save "$AFFINE_IMAGE" "$REDIS_IMAGE" "$POSTGRES_IMAGE" \
            | gzip -1 > affine-offline-amd64.tar.gz
          gzip -t affine-offline-amd64.tar.gz
          sha256sum affine-offline-amd64.tar.gz > affine-offline-amd64.tar.gz.sha256
          ls -lh affine-offline-amd64.tar.gz affine-offline-amd64.tar.gz.sha256

      - name: Upload offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: affine-offline-amd64
          path: |
            affine-offline-amd64.tar.gz
            affine-offline-amd64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
