name: Build Self-hosted Image

on:
  workflow_dispatch:
  push:
    branches:
      - canary

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      app-version: ${{ steps.version.outputs.app-version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read app version
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "app-version=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    uses: ./.github/workflows/build-images.yml
    with:
      build-type: canary
      app-version: ${{ needs.prepare.outputs.app-version }}
      git-short-hash: ${{ github.sha }}
      affine-pro-public-key: |
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEObwJiTmbui7rkWfPJ7Lozvuy2Rcl
        otcrb0V6dlS2ijKEShm7ZttTwQn08xzesdjX/AxpoR5X9yfoHkauIBuuMQ==
        -----END PUBLIC KEY-----
      image-tags: |
        ghcr.io/iszkq/affine:zh-byok
        ghcr.io/iszkq/affine:sha-${{ github.sha }}
    secrets: inherit
